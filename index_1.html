<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание «После школы»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1B2B4B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first. Compact header, day strip + one-day list; bottom tab bar on phones, top tabs and a 7-column week from 900px */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E7EAF1; --line:#D7DCE6;
  --ink:#16213A; --muted:#5D697F; --accent:#2B4C86; --accent-ink:#FFFFFF; --head:#1B2B4B; --head-ink:#F2F5FB; --head-muted:#A9B6D0;
  --bad-bg:#FBE1DE; --bad:#A3241A; --warn-bg:#FCEFCF; --warn:#7A5300; --ok-bg:#DCF0E1; --ok:#22663A;
  --d-am:#DCE7F8; --d-rech:#DDF0E2; --d-tan:#FADDE8; --d-vok:#EEDFF8; --d-grim:#FCE9D3; --d-cam:#D7F0F3;
  --d-boi:#F6DCD9; --d-dvi:#E7EED3; --d-kast:#FFF1C7; --d-dek:#ECE5DB; --d-ozv:#E3E0F6; --d-x:#E7EAF1;
  --f-display:"Literata",Georgia,serif; --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151E; --surface:#192030; --sunk:#222B3C; --line:#2E394D; --ink:#E6EAF2; --muted:#97A2B7; --accent:#8DB0F0; --accent-ink:#0E1626; --head:#0B1018; --head-ink:#E6EAF2; --head-muted:#8C98AF;
  --bad-bg:#4A2220; --bad:#FFB4AB; --warn-bg:#46391A; --warn:#F5D27A; --ok-bg:#1E3A28; --ok:#9FDDB0;
  --d-am:#25385A; --d-rech:#22402D; --d-tan:#4A2636; --d-vok:#3A2A4E; --d-grim:#4A3520; --d-cam:#1F4247;
  --d-boi:#4A2724; --d-dvi:#36402A; --d-kast:#4A4020; --d-dek:#3D362C; --d-ozv:#2E2A4C; --d-x:#2A3344; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151E; --surface:#192030; --sunk:#222B3C; --line:#2E394D; --ink:#E6EAF2; --muted:#97A2B7; --accent:#8DB0F0; --accent-ink:#0E1626; --head:#0B1018; --head-ink:#E6EAF2; --head-muted:#8C98AF;
  --bad-bg:#4A2220; --bad:#FFB4AB; --warn-bg:#46391A; --warn:#F5D27A; --ok-bg:#1E3A28; --ok:#9FDDB0;
  --d-am:#25385A; --d-rech:#22402D; --d-tan:#4A2636; --d-vok:#3A2A4E; --d-grim:#4A3520; --d-cam:#1F4247;
  --d-boi:#4A2724; --d-dvi:#36402A; --d-kast:#4A4020; --d-dek:#3D362C; --d-ozv:#2E2A4C; --d-x:#2A3344; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{background:var(--head);color:var(--head-ink)}
header.top .wrap{padding-block:14px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand p{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--head-muted)}
.brand h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.edit{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:600;color:var(--head-ink);border:1px solid color-mix(in srgb,var(--head-ink) 30%,transparent);padding:8px 12px;border-radius:9px}
.edit svg{width:15px;height:15px}
.status{font-size:12px;color:var(--head-muted);margin-top:4px}
.status b{font-weight:600;color:var(--head-ink)}

.banner{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:13px;background:var(--warn-bg);color:var(--warn)}
.banner[hidden]{display:none}

/* top tabs (desktop) */
header.top .toptabs{display:none}
/* filter row */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.controls .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.me[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select{width:100%;min-width:0;font-size:14px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}

main .wrap{padding-block:14px 24px}
.view[hidden]{display:none}

/* day strip */
.weekhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.weekhead h2{margin:0;font-family:var(--f-display);font-size:18px}
.wbtns{display:flex;gap:6px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-width:38px;height:36px;padding:0 10px;font-size:14px;font-weight:600}
.ib:disabled{opacity:.4;cursor:default}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.dbtn{border:1px solid transparent;background:var(--surface);border-radius:11px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.dbtn .w{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dbtn .n{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.dbtn .c{font-size:10.5px;color:var(--muted);height:13px}
.dbtn.today .n{color:var(--accent)}
.dbtn.hol{background:var(--warn-bg)}
.dbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dbtn[aria-pressed="true"] .w,.dbtn[aria-pressed="true"] .c,.dbtn[aria-pressed="true"].today .n{color:var(--bg)}
.dbtn .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--bad);margin-left:3px;vertical-align:1px}

.days{display:flex;flex-direction:column;gap:10px}
.day{min-width:0}
.day>h3{display:none}
.dayttl{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:500}
.hol-note{font-size:13px;padding:8px 10px;border-radius:9px;background:var(--warn-bg);color:var(--warn);margin-bottom:8px}
.list{display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);font-size:14px;padding:22px 12px;text-align:center;background:var(--surface);border-radius:12px;border:1px dashed var(--line)}

/* lesson card */
.les{display:grid;grid-template-columns:58px 1fr;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px;border:1px solid var(--line);position:relative}
.les .time{font-family:var(--f-mono);font-size:13px;line-height:1.25;font-variant-numeric:tabular-nums}
.les .time small{display:block;color:var(--muted);font-size:11.5px}
.les .body{min-width:0}
.les .top{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.les .g{font-weight:700;font-size:14.5px}
.les .br{font-size:12px;color:var(--muted)}
.les .dis{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:6px;font-size:13px;background:var(--d-x)}
.les.extra .dis{font-weight:600}
.les .p{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
.les .p.me{color:var(--accent);font-weight:600}
.les .note{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.flag{display:block;margin-top:6px;font-size:12px;padding:5px 8px;border-radius:7px}
.flag.bad{background:var(--bad-bg);color:var(--bad)}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.les.bad{border-color:var(--bad)}

/* groups */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.gcard summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.gcard summary::-webkit-details-marker{display:none}
.gcard summary h3{margin:0;font-family:var(--f-display);font-size:18px}
.gcard summary .meta{grid-column:1;font-size:13px;color:var(--muted)}
.gcard summary .cnt{grid-row:1 / span 2;grid-column:2;font-size:12px;color:var(--muted);text-align:right}
.gcard summary .cnt b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.gcard[open] summary{border-bottom:1px solid var(--line)}
.mon{padding:10px 14px 4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.mon span{text-transform:none;letter-spacing:0;font-weight:500}
.grow{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;padding:8px 14px;border-top:1px solid var(--line);font-size:13.5px}
.grow .dt{font-variant-numeric:tabular-nums;font-weight:600}
.grow .dt small{display:block;color:var(--muted);font-weight:400;font-family:var(--f-mono);font-size:11.5px}
.grow .dis{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--d-x)}
.grow.extra .dis{font-weight:600}
.grow .p{color:var(--muted);margin-left:4px}
.grow .flag{grid-column:2}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 10px}
.sechead h2{margin:0;font-family:var(--f-display);font-size:18px}
.sechead span{font-size:13px;color:var(--muted)}

/* teachers */
.tlist{display:grid;grid-template-columns:1fr;gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.tcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tcard h3{margin:0;font-size:15.5px}
.tcard .tot{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.tcard .tot b{font-size:18px;color:var(--ink)}
.tcard .sub{font-size:12.5px;color:var(--muted);margin:3px 0 10px}
.bars{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;align-items:end;height:46px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
.bars i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--accent);min-height:2px}
.bars i.zero{background:var(--line)}
.bars span{font-size:10px;color:var(--muted)}
.bars em{font-style:normal;font-size:10px;font-variant-numeric:tabular-nums;color:var(--ink)}

/* checks */
.issues{display:flex;flex-direction:column;gap:8px}
.issue{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.issue .k{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;margin-bottom:5px}
.k.bad{background:var(--bad-bg);color:var(--bad)} .k.warn{background:var(--warn-bg);color:var(--warn)}
.issue p{margin:0;font-size:14px}
.okline{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px;font-size:14px}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:18px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:grid;grid-template-columns:repeat(4,1fr)}
nav.bottom button{background:none;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted);position:relative}
nav.bottom svg{width:22px;height:22px}
nav.bottom button[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.badge[hidden]{display:none}

.loading{padding:40px 0;text-align:center;color:var(--muted)}

@media (min-width:900px){
  body{padding-bottom:0}
  nav.bottom{display:none}
  header.top .toptabs{display:flex;justify-content:flex-start;gap:4px;padding-block:0 12px}
  .toptabs button{background:none;border:0;color:var(--head-muted);font-size:14px;font-weight:600;padding:8px 14px;border-radius:8px;position:relative}
  .toptabs button[aria-selected="true"]{background:var(--head-ink);color:var(--head)}
  .toptabs .badge{position:static;display:inline-flex;margin-left:6px}
  .controls .wrap{flex-direction:row;align-items:center;flex-wrap:wrap}
  .chips{margin:0;padding:0;overflow:visible;flex-wrap:wrap}
  .selrow{grid-template-columns:repeat(2,220px)}
  .strip{display:none}
  .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .day{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
  .day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .day>h3{display:flex;justify-content:space-between;margin:0;padding:9px 10px;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
  .day>h3 b{color:var(--ink);font-size:14px}
  .day.hol>h3{background:var(--warn-bg);border-radius:12px 12px 0 0}
  .dayttl{display:none}
  .day .list{padding:6px;gap:6px}
  .day .hol-note{margin:6px 6px 0;font-size:11.5px}
  .day .les{grid-template-columns:1fr;gap:2px;padding:7px 8px;border:0;background:var(--c);border-radius:8px}
  .day .les.bad{box-shadow:inset 0 0 0 1.5px var(--bad)}
  .day .les .time{font-size:11.5px;color:var(--muted)} .day .les .time small{display:inline;font-size:11.5px;color:var(--muted)} .day .les .time small::before{content:"–"}
  .day .les .g{font-size:13px} .day .les .dis{padding:0;background:none!important;font-size:12.5px;margin-top:0}
  .day .les .p{font-size:12px;margin-top:1px}
  .day .empty{padding:14px 6px;font-size:12px;border:0;background:none}
  .tlist{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:10px;align-items:start}
  .gcard{margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <div class="brand">
    <p>Театральная студия «После школы»</p>
    <h1>Расписание</h1>
    <div class="status" id="status">Загружаю…</div>
  </div>
  <a class="edit" id="editlink" href="#" target="_blank" rel="noopener" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Править</a>
</div>
<div class="wrap toptabs" role="tablist" id="toptabs">
  <button role="tab" data-v="week">Неделя</button>
  <button role="tab" data-v="groups">Группы</button>
  <button role="tab" data-v="teachers">Педагоги</button>
  <button role="tab" data-v="checks">Проверки<span class="badge" data-badge hidden></span></button>
</div></header>

<div class="controls" id="controls"><div class="wrap">
  <div class="chips" id="brchips"></div>
  <div class="selrow">
    <select id="f-teacher" aria-label="Педагог"></select>
    <select id="f-group" aria-label="Группа"></select>
  </div>
</div></div>

<main><div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <div class="loading" id="loading">Загружаю расписание из таблицы…</div>

  <section class="view" id="v-week" hidden>
    <div class="weekhead">
      <h2 id="wtitle"></h2>
      <div class="wbtns">
        <button class="ib" id="prev" aria-label="Предыдущая неделя">←</button>
        <button class="ib" id="now">Сегодня</button>
        <button class="ib" id="next" aria-label="Следующая неделя">→</button>
      </div>
    </div>
    <div class="strip" id="strip"></div>
    <div class="days" id="days"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="view" id="v-groups" hidden><div id="groups"></div></section>
  <section class="view" id="v-teachers" hidden>
    <div class="sechead"><h2>Нагрузка</h2><span>занятий по месяцам</span></div>
    <div class="tlist" id="tlist"></div>
  </section>
  <section class="view" id="v-checks" hidden><div id="checks"></div></section>
</div></main>

<nav class="bottom" role="tablist" id="bottomnav">
  <button role="tab" data-v="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Неделя</button>
  <button role="tab" data-v="groups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.6c2.3.2 4 1.6 4.5 4.4"/></svg>Группы</button>
  <button role="tab" data-v="teachers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>Педагоги</button>
  <button role="tab" data-v="checks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 19.5h19Z"/><path d="M12 10v4.5M12 17.2v.1"/></svg>Проверки<span class="badge" data-badge hidden></span></button>
</nav>

<script>
/* ============ НАСТРОЙКА ============
   Вставьте сюда ID вашей Google Таблицы — это часть ссылки между /d/ и /edit:
   https://docs.google.com/spreadsheets/d/ ВОТ_ЭТО /edit
   Доступ к таблице: «Все, у кого есть ссылка» → «Читатель» (или выше). */

function normTime(s){s=String(s||'').trim();const m=s.match(/(\d{1,2})[:.](\d{2})(?::\d{2})?\s*(AM|PM)?/i);if(!m)return null;let h=+m[1];
  if(m[3]){if(/pm/i.test(m[3])&&h<12)h+=12;if(/am/i.test(m[3])&&h==12)h=0}return `${pad(h)}:${m[2]}`}
const objs=rows=>{const [h,...r]=rows;const H=h.map(x=>x.trim());return r.filter(x=>x.some(v=>String(v).trim())).map(x=>Object.fromEntries(H.map((k,i)=>[k,(x[i]??'').trim()])))};

async function loadSheet(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
  const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(name+': '+r.status);
  const t=await r.text();if(/^\s*<!DOCTYPE|<html/i.test(t))throw new Error('Таблица закрыта: откройте доступ по ссылке');
  return objs(csv(t));
}
async function loadAll(){
  const [les,br,gr,sp,hol]=await Promise.all(['Занятия','Филиалы','Группы','Справочник','Праздники'].map(n=>loadSheet(n).catch(e=>{if(n==='Занятия')throw e;return []})));
  return {
    lessons:les.map(o=>({d:normDate(o['Дата']),s:normTime(o['Начало']),e:normTime(o['Конец']),br:o['Филиал'],g:o['Группа'],dis:o['Дисциплина'],t:o['Педагог'],note:o['Примечание']||''})),
    branches:br.map(o=>({br:o['Филиал'],city:o['Город'],addr:o['Адрес']})).filter(x=>x.br),
    groups:gr.map(o=>({br:o['Филиал'],g:o['Группа'],age:o['Возраст'],slots:o['Дни и время'],main:o['Основной педагог']})).filter(x=>x.br),
    types:Object.fromEntries(sp.filter(o=>o['Дисциплина']).map(o=>[o['Дисциплина'],o['Тип']])),
    holidays:Object.fromEntries(hol.map(o=>[normDate(o['Дата']),o['Название']]).filter(x=>x[0]))
  };
}
function fromSnapshot(){const S=SNAPSHOT;return {
  lessons:S.l.map(a=>({d:a[0],s:a[1],e:a[2],br:a[3],g:a[4],dis:a[5],t:a[6],note:a[7]||''})),
  branches:S.b,groups:S.g,types:S.ty,holidays:S.h}}

/* ---------- проверки ---------- */
let DB, L=[], ISSUES=[];
function prepare(db){
  DB=db; const city=Object.fromEntries(db.branches.map(b=>[b.br,b.city||b.br]));
  ISSUES=[];
  L=db.lessons.map((r,i)=>({...r,i,row:i+2,x:(db.types[r.dis]||'')!=='Основное'&&!['Актёрское мастерство','Сценическая речь'].includes(r.dis),flags:[]}));
  const flag=(r,lvl,txt)=>{r.flags.push({lvl,txt})};
  const bad=L.filter(r=>!r.d||!r.s||!r.e);
  bad.forEach(r=>ISSUES.push({lvl:'warn',kind:'Не читается строка',text:`Строка ${r.row} на листе «Занятия»: проверьте дату и время (дата как 06.10.2026, время как 17:30).`}));
  L=L.filter(r=>r.d&&r.s&&r.e);
  L.forEach(r=>{
    if(!r.t||!r.g||!r.br||!r.dis){flag(r,'warn','Не заполнены группа, педагог или дисциплина');ISSUES.push({lvl:'warn',kind:'Пустое поле',text:`${fmt(r)} — строка ${r.row}: не заполнены ${[!r.br&&'филиал',!r.g&&'группа',!r.dis&&'дисциплина',!r.t&&'педагог'].filter(Boolean).join(', ')}.`})}
    if(mins(r.e)<=mins(r.s)){flag(r,'bad','Конец раньше начала');ISSUES.push({lvl:'bad',kind:'Ошибка во времени',text:`${fmt(r)} — строка ${r.row}: время окончания раньше начала.`})}
    if(db.holidays[r.d]){flag(r,'warn',`Праздник: ${db.holidays[r.d]}`);ISSUES.push({lvl:'warn',kind:'Праздничный день',text:`${fmt(r)}. ${db.holidays[r.d]} — перенесите или отмените.`})}
  });
  const by=(keyf)=>{const m={};L.forEach(r=>{const k=keyf(r);if(k)(m[k]=m[k]||[]).push(r)});return Object.values(m).map(a=>a.sort((x,y)=>mins(x.s)-mins(y.s)))};
  // дубли группы
  by(r=>r.g&&r.br?r.br+'|'+r.g+'|'+r.d+'|'+r.s:null).filter(a=>a.length>1).forEach(a=>{a.forEach(r=>flag(r,'warn','Повтор занятия'));ISSUES.push({lvl:'warn',kind:'Повтор',text:`${fmt(a[0])}: занятие записано ${a.length} раза (строки ${a.map(r=>r.row).join(', ')}).`})});
  // педагог
  by(r=>r.t?r.t+'|'+r.d:null).forEach(a=>{
    const cities=uniq(a.map(r=>city[r.br]||r.br));
    if(cities.length>1){a.forEach(r=>flag(r,'bad',`${r.t} в этот день в двух городах`));ISSUES.push({lvl:'bad',kind:'Педагог в двух городах',text:`${dlabel(a[0].d)} — ${a[0].t}: ${a.map(r=>`${r.s} ${r.br} · ${r.g}`).join('; ')}. Нужна замена на одно из занятий.`});return}
    for(let i=1;i<a.length;i++){const p=a[i-1],c=a[i],gap=mins(c.s)-mins(p.e);
      if(gap<0){[p,c].forEach(r=>flag(r,'bad',`${r.t}: наложение по времени`));ISSUES.push({lvl:'bad',kind:'Наложение у педагога',text:`${dlabel(c.d)} — ${c.t}: ${p.s}–${p.e} ${p.br} · ${p.g} и ${c.s}–${c.e} ${c.br} · ${c.g}.`})}
      else if(p.br!==c.br&&gap<45){[p,c].forEach(r=>flag(r,'warn',`Переезд между филиалами ${gap} мин`));ISSUES.push({lvl:'warn',kind:'Короткий переезд',text:`${dlabel(c.d)} — ${c.t}: ${p.br} до ${p.e}, ${c.br} с ${c.s}. На дорогу ${gap} мин.`})}}
  });
  // зал
  by(r=>r.br?r.br+'|'+r.d:null).forEach(a=>{for(let i=1;i<a.length;i++){const p=a[i-1],c=a[i];if(mins(c.s)<mins(p.e)&&p.g!==c.g){[p,c].forEach(r=>flag(r,'bad','Зал занят другой группой'));ISSUES.push({lvl:'bad',kind:'Зал занят',text:`${dlabel(c.d)}, ${c.br}: ${p.g} ${p.s}–${p.e} и ${c.g} ${c.s}–${c.e}.`})}}});
  L.sort((a,b)=>a.d.localeCompare(b.d)||mins(a.s)-mins(b.s));
  ISSUES.sort((a,b)=>(a.lvl==='bad'?0:1)-(b.lvl==='bad'?0:1));
}
const dlabel=s=>{const d=pd(s);return `${d.getDate()} ${MN[d.getMonth()]}, ${W[(d.getDay()+6)%7].toLowerCase()}`};
const fmt=r=>`${dlabel(r.d)} ${r.s} — ${r.br} · ${r.g||'без группы'} · ${r.dis||'—'}${r.t?' · '+r.t:''}`;

/* ---------- состояние ---------- */
const S={view:store.get('ps-view')||'week',br:'',g:'',t:store.get('ps-me')||'',week:null,day:null};
const h=location.hash.slice(1);if(['week','groups','teachers','checks'].includes(h))S.view=h;
function weekBounds(){const f=pd(L[0].d),l=pd(L[L.length-1].d);return [monday(f),monday(l)]}
function goToday(){const [a,b]=weekBounds();const t=new Date();let m=monday(t);if(m<a)m=a;if(m>b)m=b;S.week=m;
  const inW=t>=m&&t<new Date(m.getFullYear(),m.getMonth(),m.getDate()+7);S.day=inW?(t.getDay()+6)%7:0}

function pass(r){return (!S.br||r.br===S.br)&&(!S.g||r.br+'|'+r.g===S.g)&&(!S.t||r.t===S.t)}
function flagHTML(r){const f=r.flags.find(x=>x.lvl==='bad')||r.flags[0];return f?`<span class="flag ${f.lvl}">${esc(f.txt)}</span>`:''}
function lesHTML(r){
  const bad=r.flags.some(f=>f.lvl==='bad');
  return `<article class="les${r.x?' extra':''}${bad?' bad':''}" style="--c:${dc(r.dis)}">
    <div class="time">${r.s}<small>${r.e}</small></div>
    <div class="body"><div class="top"><span class="g">${esc(r.g||'Без группы')}</span>${S.br?'':`<span class="br">${esc(r.br)}</span>`}</div>
    <span class="dis" style="background:${dc(r.dis)}">${esc(r.dis)}</span>
    <span class="p${S.t&&r.t===S.t?' me':''}">${esc(r.t||'Педагог не назначен')}</span>
    ${r.note?`<span class="note">${esc(r.note)}</span>`:''}${flagHTML(r)}</div></article>`;
}
function renderWeek(){
  const [a,b]=weekBounds();
  const days=[...Array(7)].map((_,i)=>iso(new Date(S.week.getFullYear(),S.week.getMonth(),S.week.getDate()+i)));
  const d0=pd(days[0]),d6=pd(days[6]);
  document.getElementById('wtitle').textContent=d0.getMonth()===d6.getMonth()?`${d0.getDate()}–${d6.getDate()} ${MN[d6.getMonth()]}`:`${d0.getDate()} ${MN[d0.getMonth()].slice(0,3)} – ${d6.getDate()} ${MN[d6.getMonth()].slice(0,3)}`;
  document.getElementById('prev').disabled=S.week<=a;document.getElementById('next').disabled=S.week>=b;
  const rs=L.filter(pass),today=iso(new Date());
  const per=days.map(d=>rs.filter(r=>r.d===d));
  document.getElementById('strip').innerHTML=days.map((d,i)=>{const dd=pd(d);const n=per[i].length;const hasBad=per[i].some(r=>r.flags.some(f=>f.lvl==='bad'));
    return `<button class="dbtn${d===today?' today':''}${DB.holidays[d]?' hol':''}" data-i="${i}" aria-pressed="${i===S.day}"><span class="w">${W[i]}</span><span class="n">${dd.getDate()}</span><span class="c">${n?n+(hasBad?'<i class="dot"></i>':''):''}</span></button>`}).join('');
  const mobile=!matchMedia('(min-width:900px)').matches;
  document.getElementById('days').innerHTML=days.map((d,i)=>{
    if(mobile&&i!==S.day)return '';
    const dd=pd(d);const ls=per[i];
    return `<div class="day${d===today?' today':''}${DB.holidays[d]?' hol':''}"><h3><span>${W[i]}</span><b>${dd.getDate()}.${pad(dd.getMonth()+1)}</b></h3>
      <p class="dayttl">${['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'][i]}, ${dd.getDate()} ${MN[dd.getMonth()]} · ${ls.length?ls.length+' '+plural(ls.length,'занятие','занятия','занятий'):'занятий нет'}</p>
      ${DB.holidays[d]?`<div class="hol-note">${esc(DB.holidays[d])}</div>`:''}
      <div class="list">${ls.length?ls.map(lesHTML).join(''):'<div class="empty">Занятий нет</div>'}</div></div>`}).join('');
}
const plural=(n,a,b,c)=>{const m=n%10,k=n%100;return m==1&&k!=11?a:m>=2&&m<=4&&(k<10||k>=20)?b:c};
function renderGroups(){
  const gs=(DB.groups.length?DB.groups:uniq(L.map(r=>r.br+'|'+r.g)).map(k=>{const [br,g]=k.split('|');return {br,g}}))
    .filter(g=>(!S.br||g.br===S.br)&&(!S.g||g.br+'|'+g.g===S.g));
  const html=gs.map(g=>{
    const rs=L.filter(r=>r.br===g.br&&r.g===g.g&&(!S.t||r.t===S.t));if(!rs.length)return '';
    const months=uniq(rs.map(r=>r.d.slice(0,7)));
    const body=months.map(m=>{const mr=rs.filter(r=>r.d.startsWith(m));const x=mr.filter(r=>r.x).length;const [y,mm]=m.split('-');
      return `<div class="mon">${MNOM[mm-1]} ${y}<span>${mr.length} · доп. ${x}</span></div>`+mr.map(r=>{const d=pd(r.d);
        return `<div class="grow${r.x?' extra':''}"><div class="dt">${d.getDate()}.${pad(d.getMonth()+1)} ${W[(d.getDay()+6)%7]}<small>${r.s}–${r.e}</small></div><div><span class="dis" style="background:${dc(r.dis)}">${esc(r.dis)}</span><span class="p">${esc(r.t)}</span></div>${r.flags.length?flagHTML(r):''}</div>`}).join('')}).join('');
    const open=S.g===g.br+'|'+g.g||gs.length===1;
    return `<details class="gcard"${open?' open':''}><summary><h3>${esc(g.g)}</h3><span class="meta">${esc(g.br)}${g.age?' · '+esc(g.age):''}</span><span class="meta">${esc(g.slots||'')}${g.main?' · '+esc(g.main):''}</span><span class="cnt"><b>${rs.length}</b>занятий</span></summary>${body}</details>`}).join('');
  document.getElementById('groups').innerHTML=`<div class="sechead"><h2>Группы</h2><span>нажмите, чтобы раскрыть</span></div><div class="gwrap">${html||'<div class="empty">Под выбранный фильтр групп нет</div>'}</div>`;
}
function renderTeachers(){
  const months=uniq(L.map(r=>r.d.slice(0,7))).sort();
  const rs=L.filter(r=>(!S.br||r.br===S.br)&&r.t);
  const ts=uniq(rs.map(r=>r.t)).map(t=>{const m=rs.filter(r=>r.t===t);return {t,m,per:months.map(mm=>m.filter(r=>r.d.startsWith(mm)).length),dis:uniq(m.map(r=>r.dis)),br:uniq(m.map(r=>r.br)),h:m.reduce((a,r)=>a+(mins(r.e)-mins(r.s))/60,0)}}).sort((a,b)=>b.m.length-a.m.length);
  const mx=Math.max(1,...ts.flatMap(x=>x.per));
  document.getElementById('tlist').innerHTML=ts.map(x=>`<button class="tcard" data-t="${esc(x.t)}">
    <div class="row"><h3>${esc(x.t)}</h3><span class="tot"><b>${x.m.length}</b> зан. · ${String(Math.round(x.h*10)/10).replace('.',',')} ч</span></div>
    <div class="sub">${esc(x.dis.join(', '))} · ${esc(x.br.join(', '))}</div>
    <div class="bars" style="--n:${months.length}">${x.per.map((n,i)=>`<div><em>${n||''}</em><i class="${n?'':'zero'}" style="height:${n?Math.max(8,n/mx*100):4}%"></i><span>${MNOM[+months[i].slice(5)-1].slice(0,3)}</span></div>`).join('')}</div></button>`).join('');
}
function renderChecks(){
  document.getElementById('checks').innerHTML=`<div class="sechead"><h2>Проверки</h2><span>${ISSUES.length?ISSUES.length+' '+plural(ISSUES.length,'вопрос','вопроса','вопросов'):'всё в порядке'}</span></div>`+
   (ISSUES.length?`<div class="issues">${ISSUES.map(i=>`<div class="issue"><span class="k ${i.lvl}">${esc(i.kind)}</span><p>${esc(i.text)}</p></div>`).join('')}</div>`:'')+
   `<p class="okline" style="margin-top:12px">Страница сама проверяет: педагог в двух местах сразу, переезд между городами и филиалами (меньше 45 мин), два занятия в одном зале, праздники, повторы и ошибки в строках.</p>`;
}
function render(){
  ['week','groups','teachers','checks'].forEach(v=>document.getElementById('v-'+v).hidden=v!==S.view);
  document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===S.view));
  document.getElementById('controls').hidden=S.view==='checks';
  document.getElementById('f-group').hidden=S.view==='teachers';document.getElementById('f-teacher').hidden=S.view==='teachers';
  document.querySelectorAll('#brchips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.br===S.br));
  const gsel=document.getElementById('f-group');
  const gl=uniq(L.filter(r=>!S.br||r.br===S.br).map(r=>r.br+'|'+r.g)).sort((a,b)=>{const [ba,ga]=a.split('|'),[bb,gb]=b.split('|');return ba.localeCompare(bb)||GO.indexOf(ga)-GO.indexOf(gb)});
  gsel.innerHTML='<option value="">Все группы</option>'+gl.map(k=>{const [b,g]=k.split('|');return `<option value="${esc(k)}">${esc(S.br?g:b+' · '+g)}</option>`}).join('');
  if(!gl.includes(S.g))S.g='';gsel.value=S.g;
  document.getElementById('f-teacher').value=S.t;
  if(S.view==='week')renderWeek();if(S.view==='groups')renderGroups();if(S.view==='teachers')renderTeachers();if(S.view==='checks')renderChecks();
  store.set('ps-view',S.view);
}
function setup(){
  const brs=uniq([...DB.branches.map(b=>b.br),...L.map(r=>r.br)]).filter(Boolean);
  document.getElementById('brchips').innerHTML=['',...brs].map(b=>`<button class="chip" data-br="${esc(b)}" aria-pressed="false">${esc(b||'Все филиалы')}</button>`).join('');
  document.getElementById('brchips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;S.br=c.dataset.br;S.g='';render()};
  const ts=uniq(L.map(r=>r.t).filter(Boolean)).sort((a,b)=>a.localeCompare(b,'ru'));
  if(S.t&&!ts.includes(S.t))S.t='';
  document.getElementById('f-teacher').innerHTML='<option value="">Все педагоги</option>'+ts.map(t=>`<option>${esc(t)}</option>`).join('');
  document.getElementById('f-teacher').onchange=e=>{S.t=e.target.value;store.set('ps-me',S.t);render()};
  document.getElementById('f-group').onchange=e=>{S.g=e.target.value;render()};
  document.getElementById('strip').onclick=e=>{const b=e.target.closest('.dbtn');if(!b)return;S.day=+b.dataset.i;renderWeek()};
  document.getElementById('prev').onclick=()=>{S.week=new Date(S.week.getFullYear(),S.week.getMonth(),S.week.getDate()-7);renderWeek()};
  document.getElementById('next').onclick=()=>{S.week=new Date(S.week.getFullYear(),S.week.getMonth(),S.week.getDate()+7);renderWeek()};
  document.getElementById('now').onclick=()=>{goToday();renderWeek()};
  document.getElementById('tlist').onclick=e=>{const c=e.target.closest('.tcard');if(!c)return;S.t=c.dataset.t;store.set('ps-me',S.t);S.view='week';render();scrollTo(0,0)};
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render();scrollTo(0,0)});
  document.querySelectorAll('[data-badge]').forEach(b=>{const n=ISSUES.filter(i=>i.lvl==='bad').length||ISSUES.length;b.textContent=n;b.hidden=!ISSUES.length});
  document.getElementById('legend').innerHTML=Object.keys(DV).filter(d=>d!=='Пластика и танец').map(d=>`<span><i style="background:${dc(d)}"></i>${d}</span>`).join('')+'<span>жирным — дополнительное занятие</span>';
  let lastMobile=matchMedia('(min-width:900px)').matches;
  addEventListener('resize',()=>{const m=matchMedia('(min-width:900px)').matches;if(m!==lastMobile){lastMobile=m;if(S.view==='week')renderWeek()}});
  goToday();
}
(async()=>{
  const st=document.getElementById('status'),bn=document.getElementById('banner');
  let db,live=false;
  if(SHEET_ID&&!SHEET_ID.startsWith('__')){
    const el=document.getElementById('editlink');el.href=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;el.hidden=false;
    try{db=await loadAll();live=true}catch(e){bn.textContent=`Не получилось загрузить таблицу (${e.message}). Показана копия от ${SNAPSHOT.date}. Проверьте, что доступ открыт «Всем, у кого есть ссылка».`;bn.hidden=false}
  }else{bn.textContent=`Таблица ещё не подключена — показана копия расписания от ${SNAPSHOT.date}.`;bn.hidden=false}
  if(!db)db=fromSnapshot();
  prepare(db);
  document.getElementById('loading').hidden=true;
  if(!L.length){document.getElementById('loading').hidden=false;document.getElementById('loading').textContent='На листе «Занятия» нет ни одной строки.';return}
  const now=new Date();
  st.innerHTML=live?`Из таблицы · обновлено в <b>${pad(now.getHours())}:${pad(now.getMinutes())}</b>`:`Копия от <b>${SNAPSHOT.date}</b>`;
  setup();render();
})();
</script>
